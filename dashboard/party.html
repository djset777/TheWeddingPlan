<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Team — The Wedding Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Cormorant+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Site navigation"></aside>

    <main class="content">
      <div data-team-view>
        <div class="state">Loading…</div>
      </div>
      <footer class="page-footer">
        <span class="page-footer__name">Danisa &amp; Julian</span>
      </footer>

    </main>
  </div>

  <!-- Parent task modal (hidden until a card is clicked) -->
  <div class="modal" data-modal hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" data-modal-close aria-label="Close">×</button>
      <div data-modal-body></div>
    </div>
  </div>

  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/party.js"></script>
</body>
</html>
