<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Look — The Wedding Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Cormorant+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Site navigation"></aside>

    <main class="content">

      <header class="content__head">
        <span class="eyebrow content__eyebrow">The Brief</span>
        <h1 class="content__title">The Look</h1>
        <p class="subtitle content__subtitle">What the day looks like.</p>
      </header>

      <div class="wrap--narrow">

        <div class="zone">
          <h2 class="section-head">The Palette</h2>

          <div class="pal">
            <div class="pal__group pal__group--first" style="flex-basis: 64%;">
              <div class="pal__label">Sourced</div>
              <div class="pal__rule"></div>
              <div class="pal__bar" aria-hidden="true">
                <span class="pal__seg" style="flex-basis: 66.6667%; background: #01605F;"></span>
                <span class="pal__seg" style="flex-basis: 33.3333%; background: #E8B024;"></span>
              </div>
              <div class="pal__legend">
                <div class="pal__cell" style="flex-basis: 66.6667%;">
                  <span class="pal__name">Teal</span>
                  <span class="pal__hex">#01605F</span>
                  <span class="pal__anchor">Paper</span>
                </div>
                <div class="pal__cell" style="flex-basis: 33.3333%;">
                  <span class="pal__name">Bloom Yellow</span>
                  <span class="pal__hex">#E8B024</span>
                  <span class="pal__anchor">Flowers</span>
                </div>
              </div>
            </div>
            <div class="pal__group" style="flex-basis: 22%;">
              <div class="pal__label">Material</div>
              <div class="pal__rule"></div>
              <div class="pal__bar" aria-hidden="true">
                <span class="pal__seg" style="flex-basis: 50%; background: #D4AF37;"></span>
                <span class="pal__seg" style="flex-basis: 50%; background: #E8DCC4;"></span>
              </div>
              <div class="pal__legend">
                <div class="pal__cell" style="flex-basis: 50%;">
                  <span class="pal__name">Gold</span>
                  <span class="pal__hex">#D4AF37</span>
                  <span class="pal__anchor">Metal</span>
                </div>
                <div class="pal__cell" style="flex-basis: 50%;">
                  <span class="pal__name">Bamboo</span>
                  <span class="pal__hex">#E8DCC4</span>
                  <span class="pal__anchor">Surfaces</span>
                </div>
              </div>
            </div>
            <div class="pal__group pal__group--last" style="flex-basis: 14%;">
              <div class="pal__label">Elemental</div>
              <div class="pal__rule"></div>
              <div class="pal__bar" aria-hidden="true">
                <span class="pal__seg" style="flex-basis: 50%; background: #014421;"></span>
                <span class="pal__seg" style="flex-basis: 50%; background: #003153;"></span>
              </div>
              <div class="pal__legend">
                <div class="pal__cell" style="flex-basis: 50%;">
                  <span class="pal__name">Forest</span>
                  <span class="pal__hex">#014421</span>
                  <span class="pal__anchor">Hillside</span>
                </div>
                <div class="pal__cell" style="flex-basis: 50%;">
                  <span class="pal__name">Celestial</span>
                  <span class="pal__hex">#003153</span>
                  <span class="pal__anchor">Dusk</span>
                </div>
              </div>
            </div>
          </div>
        </div>
</div>

        <div class="zone">
          <h2 class="section-head">The Mood</h2>

          <div class="mood-plain">
            <figure class="mb-tile"><img src="../assets/img/mood/01-tablesetting.webp" alt="" loading="lazy"></figure>
            <figure class="mb-tile"><img src="../assets/img/mood/02-bar.webp" alt="" loading="lazy"></figure>
            <figure class="mb-tile"><img src="../assets/img/mood/03-stringlights.webp" alt="" loading="lazy"></figure>
            <figure class="mb-tile"><img src="../assets/img/mood/04-plantfruit.webp" alt="" loading="lazy"></figure>
            <figure class="mb-tile"><img src="../assets/img/mood/05-mirror.webp" alt="" loading="lazy"></figure>
            <figure class="mb-tile"><img src="../assets/img/mood/06-birds.webp" alt="" loading="lazy"></figure>
            <figure class="mb-tile"><img src="../assets/img/mood/08-guestbook.webp" alt="" loading="lazy"></figure>
            <figure class="mb-tile"><img src="../assets/img/mood/07-canoe.webp" alt="" loading="lazy"></figure>
            <figure class="mb-tile"><img src="../assets/img/mood/09-tablescape.webp" alt="" loading="lazy"></figure>
            <figure class="mb-tile"><img src="../assets/img/mood/10-maracas.webp" alt="" loading="lazy"></figure>
            <figure class="mb-tile"><img src="../assets/img/mood/11-food.webp" alt="" loading="lazy"></figure>
            <figure class="mb-tile"><img src="../assets/img/mood/12-bar2.webp" alt="" loading="lazy"></figure>
          </div>
        </div>

<footer class="page-footer">
        <span class="page-footer__name">Danisa &amp; Julian</span>
      </footer>

    </main>
  </div>

  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/main.js"></script>
</body>
</html>
