<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wedding Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Cormorant+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Site navigation"></aside>

    <main class="content">

      <header class="home-head">
        <div class="home-head__title">
          <span class="eyebrow">Danisa &amp; Julian</span>
          <h1 class="home-head__h1">The Wedding Plan</h1>
          <p class="home-head__subtitle">Jarabacoa · La Vega · Dominican Republic</p>
        </div>
      </header>

      <div class="tasklist-card__meta-row tasklist-card__meta-row--standalone">
        <span class="tasklist-card__meta" data-tasklist-meta>—</span>
      </div>

      <div class="viewtabs" data-view-tabs></div>

      <div data-tasklist>
        <div class="state">Loading…</div>
      </div>

    </main>
  </div>

  <!-- Parent task modal (hidden until a card is clicked) -->
  <div class="modal" data-modal hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" data-modal-close aria-label="Close">×</button>
      <div data-modal-body></div>
    </div>
  </div>

  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
