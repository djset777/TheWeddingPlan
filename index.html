<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wedding Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&family=Cormorant+SC:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="Site navigation"></aside>

    <main class="content">

      <header class="home-head">
        <div class="home-head__title">
          <span class="eyebrow">Danisa &amp; Julian</span>
          <h1 class="home-head__h1">The Wedding Plan</h1>
          <p class="home-head__subtitle">El Aguacate · La Vega · Dominican Republic</p>
        </div>

        <div class="home-head__rsvp" data-chart="rsvp">
          <svg class="rsvp-donut" viewBox="0 0 42 42" role="img" aria-label="RSVP status">
            <circle class="rsvp-donut__ring" cx="21" cy="21" r="15.915" fill="transparent" stroke-width="4"></circle>
            <circle class="rsvp-donut__seg" cx="21" cy="21" r="15.915" fill="transparent" stroke-width="4"
                    stroke="#014421" stroke-dasharray="0 100" stroke-dashoffset="25" data-seg="confirmed"></circle>
            <circle class="rsvp-donut__seg" cx="21" cy="21" r="15.915" fill="transparent" stroke-width="4"
                    stroke="#003153" stroke-dasharray="0 100" stroke-dashoffset="25" data-seg="declined"></circle>
            <text class="rsvp-donut__label" x="21" y="20">RSVP</text>
            <text class="rsvp-donut__num" x="21" y="26" data-total>—</text>
          </svg>
          <div class="rsvp-legend">
            <div class="rsvp-legend__row rsvp-legend__row--confirmed">
              <span class="rsvp-legend__dot"></span>
              <span class="rsvp-legend__value" data-legend="confirmed">—</span>
              <span class="rsvp-legend__label">confirmed</span>
            </div>
            <div class="rsvp-legend__row rsvp-legend__row--declined">
              <span class="rsvp-legend__dot"></span>
              <span class="rsvp-legend__value" data-legend="declined">—</span>
              <span class="rsvp-legend__label">declined</span>
            </div>
            <div class="rsvp-legend__row rsvp-legend__row--awaiting">
              <span class="rsvp-legend__dot"></span>
              <span class="rsvp-legend__value" data-legend="awaiting">—</span>
              <span class="rsvp-legend__label">awaiting</span>
            </div>
          </div>
        </div>
      </header>

      <nav class="timeline" data-timeline aria-label="Filter by timeframe"></nav>

      <section class="pies">
        <div class="pie" data-pie="phase">
          <div class="pie__label">By Phase</div>
          <div class="pie__body">
            <svg class="pie__svg" viewBox="0 0 42 42" role="img" aria-label="Tasks by phase">
              <circle class="pie__ring" cx="21" cy="21" r="15.915" fill="transparent" stroke-width="4"></circle>
            </svg>
            <div class="pie__legend" data-pie-legend></div>
          </div>
        </div>

        <div class="pie" data-pie="category">
          <div class="pie__label">By Category</div>
          <div class="pie__body">
            <svg class="pie__svg" viewBox="0 0 42 42" role="img" aria-label="Tasks by category">
              <circle class="pie__ring" cx="21" cy="21" r="15.915" fill="transparent" stroke-width="4"></circle>
            </svg>
            <div class="pie__legend" data-pie-legend></div>
          </div>
        </div>

        <div class="pie" data-pie="assignee">
          <div class="pie__label">By Assignee</div>
          <div class="pie__body">
            <svg class="pie__svg" viewBox="0 0 42 42" role="img" aria-label="Tasks by assignee">
              <circle class="pie__ring" cx="21" cy="21" r="15.915" fill="transparent" stroke-width="4"></circle>
            </svg>
            <div class="pie__legend" data-pie-legend></div>
          </div>
        </div>
      </section>

      <section class="tasklist-card">
        <div class="tasklist-card__head">
          <span class="tasklist-card__label" data-tasklist-label>Alive Now</span>
          <span class="tasklist-card__meta" data-tasklist-meta>—</span>
        </div>
        <div data-tasklist>
          <div class="state">Loading…</div>
        </div>
      </section>

    </main>
  </div>

  <script src="assets/js/sidebar.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
